apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

// This module is built as a local project of the Ruuvi Station app, with
// the Android Gradle Plugin of the app. The settings agree with the app.
android {
    compileSdk 37

    namespace 'com.ruuvi.station.bluetooth.def'

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 37
        versionCode 10811
        versionName "1.8.11-vlongmem"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }
}

def kodein_version = "6.5.0"

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation 'com.neovisionaries:nv-bluetooth:1.8'
    implementation 'no.nordicsemi.android:ble-ktx:2.7.3'

    implementation "org.jetbrains.kotlin:kotlin-stdlib"

    implementation 'com.jakewharton.timber:timber:4.7.1'
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'net.swiftzer.semver:semver:1.1.1'

    implementation("androidx.work:work-runtime-ktx:2.10.1")

    implementation "org.kodein.di:kodein-di-generic-jvm:$kodein_version"
    implementation "org.kodein.di:kodein-di-framework-android-x:$kodein_version"
}
